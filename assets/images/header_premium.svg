<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.03" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="400" height="200" fill="url(#bgGrad)"/>

  <circle cx="350" cy="30" r="60" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="50" cy="180" r="80" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="200" cy="100" r="120" fill="#FFFFFF" opacity="0.02"/>

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="240" y1="0" x2="240" y2="200"/>
    <line x1="320" y1="0" x2="320" y2="200"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="140" y="30" width="120" height="140" rx="16" fill="url(#cardGrad1)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="155" y="45" width="90" height="110" rx="12" fill="url(#shieldGrad)"/>
  </g>

  <g filter="url(#glow)">
    <path d="M200 65 L225 75 L225 105 Q225 130 200 145 Q175 130 175 105 L175 75 Z" fill="#2563EB"/>
    <path d="M200 70 L220 78 L220 105 Q220 126 200 140 Q180 126 180 105 L180 78 Z" fill="#3B82F6"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="200" cy="100" r="16" fill="url(#checkGrad)"/>
    <path d="M192 100 L198 106 L208 94" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="30" y="60" width="80" height="50" rx="10" fill="url(#cardGrad2)" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
  </g>
  <circle cx="50" cy="78" r="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="64" y="72" width="32" height="4" rx="2" fill="#FFFFFF" opacity="0.25"/>
  <rect x="64" y="80" width="24" height="3" rx="1.5" fill="#FFFFFF" opacity="0.15"/>
  <rect x="42" y="92" width="56" height="6" rx="3" fill="#10B981" opacity="0.6"/>

  <g filter="url(#cardShadow)">
    <rect x="290" y="90" width="80" height="50" rx="10" fill="url(#cardGrad2)" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
  </g>
  <circle cx="310" cy="108" r="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="324" y="102" width="32" height="4" rx="2" fill="#FFFFFF" opacity="0.25"/>
  <rect x="324" y="110" width="24" height="3" rx="1.5" fill="#FFFFFF" opacity="0.15"/>
  <rect x="302" y="122" width="56" height="6" rx="3" fill="#F59E0B" opacity="0.6"/>

  <g filter="url(#cardShadow)">
    <rect x="50" y="130" width="70" height="40" rx="8" fill="url(#cardGrad2)" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
  </g>
  <rect x="62" y="142" width="46" height="4" rx="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="62" y="150" width="36" height="3" rx="1.5" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="106" cy="150" r="6" fill="#10B981" opacity="0.5"/>

  <g filter="url(#cardShadow)">
    <rect x="280" y="40" width="70" height="40" rx="8" fill="url(#cardGrad2)" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.15"/>
  </g>
  <rect x="292" y="52" width="46" height="4" rx="2" fill="#FFFFFF" opacity="0.2"/>
  <rect x="292" y="60" width="36" height="3" rx="1.5" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="336" cy="60" r="6" fill="#3B82F6" opacity="0.5"/>

  <g opacity="0.6">
    <circle cx="130" cy="50" r="2" fill="#FFFFFF"/>
    <circle cx="270" cy="160" r="2" fill="#FFFFFF"/>
    <circle cx="340" cy="80" r="1.5" fill="#FFFFFF"/>
    <circle cx="60" cy="110" r="1.5" fill="#FFFFFF"/>
    <circle cx="180" cy="20" r="1.5" fill="#FFFFFF"/>
    <circle cx="370" cy="140" r="2" fill="#FFFFFF"/>
  </g>

  <g opacity="0.4" stroke="#FFFFFF" stroke-width="0.8" fill="none">
    <path d="M130 50 Q165 55 175 75"/>
    <path d="M225 75 Q240 90 270 85"/>
    <path d="M270 160 Q240 155 225 145"/>
    <path d="M60 110 Q90 105 130 100"/>
  </g>
</svg>
